apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-service
  namespace: calculator
  labels:
    app.kubernetes.io/name: calculator-service
    app.kubernetes.io/part-of: calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calculator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calculator-service
        app.kubernetes.io/part-of: calculator
    spec:
      containers:
        - name: calculator-service
          image: calculator-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-service
  namespace: calculator
  labels:
    app.kubernetes.io/name: calculator-service
    app.kubernetes.io/part-of: calculator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calculator-service
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
